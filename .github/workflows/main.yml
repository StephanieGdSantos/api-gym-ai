on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION : us-east-1

permissions:
      id-token: write
      contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_VAR_cohere_api_key: ${{ secrets.COHERE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::084828562528:role/GitHubAction-AssumeRole
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Lambda package
        run: dotnet publish APIGymAi/APIGymAi.csproj --configuration Release --output artifacts/publish --self-contained false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=gym-ai-api/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}" -backend-config="use_lockfile=true"
      - name: Terraform plan
        working-directory: infra
        run: terraform plan -out=tfplan
      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: infra
        run: terraform apply -auto-approve tfplan